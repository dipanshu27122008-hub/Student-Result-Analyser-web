# ========================================================
# Database Configuration for Student Result Analysis System
# ========================================================
# Configure your MySQL connection parameters below:

db.driver=com.mysql.cj.jdbc.Driver
db.url=jdbc:mysql://localhost:3306/student_result_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
db.username=root
db.password=root

# Set to true to automatically fallback to an in-memory embedded H2 database
# if MySQL is offline or connection fails. Set to false to strictly require MySQL.
db.fallback.h2=true
